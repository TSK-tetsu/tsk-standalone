<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSK 仕様書・発注納期</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #EDF0F4; --card: #FFFFFF; --ink: #0B1F3A; --sub: #45546B;
    --line: #DBE1E9; --edge: #A7B2C2; --gold: #7D622F; --on: #0B1F3A; --on-ink: #FFFFFF;
    --warn: #7A2E22; --warn-bg: #F3DDD6; --press: #E3E8EF;
    --band: #0B1F3A; --band-2: #12294A; --band-ink: #FFFFFF; --band-sub: #C6D0DE; --band-gold: #D9BC7A;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #060E1A; --card: #0E1F38; --ink: #F1ECE0; --sub: #A9B5C7;
      --line: #1C3253; --edge: #3A5278; --gold: #D9BC7A; --on: #D9BC7A; --on-ink: #081527;
      --warn: #F0B6A8; --warn-bg: #4A2019; --press: #16294A;
      --band: #0B1F3A; --band-2: #12294A; --band-ink: #FFFFFF; --band-sub: #C6D0DE; --band-gold: #D9BC7A;
    }
  }
  :root[data-theme="dark"] {
    --ground: #060E1A; --card: #0E1F38; --ink: #F1ECE0; --sub: #A9B5C7;
    --line: #1C3253; --edge: #3A5278; --gold: #D9BC7A; --on: #D9BC7A; --on-ink: #081527;
    --warn: #F0B6A8; --warn-bg: #4A2019; --press: #16294A;
    --band: #0B1F3A; --band-2: #12294A; --band-ink: #FFFFFF; --band-sub: #C6D0DE; --band-gold: #D9BC7A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%;
  }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #app { max-width: 480px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
  .bar { position: sticky; top: 0; z-index: 10; min-height: 64px; padding: 10px 12px; background: var(--band); color: var(--band-ink); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .back { min-height: 44px; padding: 0 18px 0 10px; border: 1.5px solid rgba(255,255,255,.6); border-radius: 22px; background: rgba(255,255,255,.1); color: var(--band-ink); display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; }

  .step { display: inline-flex; align-items: center; gap: 5px; color: var(--band-gold); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .step i.on { background: var(--band-gold); }
  .step span { margin-left: 5px; }

  .head.first { padding-top: 44px; gap: 10px; }

  .appTitle { font-family: 'Zen Old Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: .04em; }

  h1.sub { font-size: 24px; font-family: inherit; letter-spacing: 0; }
  .lead { font-size: 16px; color: var(--band-sub); }

  }
  .bar { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  .head.first { padding-top: calc(4px + env(safe-area-inset-top, 0px)); }

  .sw { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }

  .sw .saved { position: relative; z-index: 1; border-bottom: none; transition: transform .18s ease; }
  .sw.open .saved { transform: translateX(-104px); }

  .ver { margin: 18px 24px 0; text-align: center; font-size: 13px; color: var(--sub); }
  .sheet { --ground: #EDF0F4; --card: #FFFFFF; --ink: #0B1F3A; --sub: #45546B; --line: #DBE1E9; --edge: #A7B2C2; --gold: #7D622F; --on: #0B1F3A; --on-ink: #FFFFFF; --warn: #7A2E22; --warn-bg: #F3DDD6; --press: #E3E8EF; --band: #0B1F3A; --band-2: #12294A; --band-ink: #FFFFFF; --band-sub: #C6D0DE; --band-gold: #D9BC7A; color-scheme: light; }

  .switch[aria-checked="true"] i { background: var(--on); }

  .form textarea { min-height: 96px; line-height: 1.5; resize: vertical; }

@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:20px;font-weight:900;margin-bottom:4px}
.sheet .lead{color:var(--muted);font-size:14px;margin-bottom:14px}
.steps{display:flex;gap:6px;margin:0 0 14px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--gold)}
.steps i.done{background:var(--green)}
.f{margin-bottom:14px}
.f label{display:block;font-size:14px;color:var(--muted);margin-bottom:5px;font-weight:600}
.f input,.f select{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:18px;background:var(--well);color:var(--ink);min-height:52px}
.f input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;min-height:46px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.opt.new{border-style:dashed;color:var(--muted)}
.opt .k{font-weight:900;color:var(--gold-dk);margin-right:6px}
.opt[aria-pressed="true"] .k{color:var(--gold)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 2px;font-size:13px;font-weight:700;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.btns{display:flex;gap:10px;margin-top:8px}
.btns .b{flex:1}
.btns .b-ghost,.btns .b-red{flex:0 0 auto}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 12px}
.f input.bad{border-color:var(--red)}
.kfb{font-size:13px;margin-top:6px;padding:8px 10px;border-radius:10px;line-height:1.4}
.kfb.err{background:var(--red-bg,#FDECEA);color:var(--red)}.kfb.warn{background:var(--gold-soft);color:#5A4300}.kfb.ok{background:#E6F4EC;color:var(--green-dk)}
@media (prefers-color-scheme:dark){:host(:not([data-theme="light"])) .kfb.ok{background:#173426;color:#9BE3BB} :host(:not([data-theme="light"])) .kfb.warn{background:#3A3010;color:var(--gold-soft)}}
.lnk{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-decoration:underline;padding:0 2px;cursor:pointer}
.linebox{white-space:pre-wrap;font-size:14px;line-height:1.5;background:var(--well);border:2px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.ro{background:var(--gold-soft);color:#5A4300;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px;display:none}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 14px;font-size:16px}
.detail dt{color:var(--muted);font-weight:500}.detail dd{margin:0;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;border:1.5px solid var(--gold);white-space:nowrap}
.toast.show{opacity:1}

/* ---------- PC layout（.mode-d） ---------- */
:host(.mode-d) .bd-body{font-size:15px}
:host(.mode-d) .top .in{max-width:1280px;margin:0 auto;padding:12px 24px}
:host(.mode-d) .modeswitch{display:inline-flex}
:host(.mode-d) .body{max-width:1280px;margin:0 auto;width:100%;gap:0}
:host(.mode-d) .side{display:flex;flex-direction:column;gap:4px;width:220px;flex:0 0 220px;padding:18px 12px;border-right:1px solid var(--line)}
:host(.mode-d) .side button{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;color:var(--muted);text-align:left;position:relative;min-height:46px}
:host(.mode-d) .side button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:host(.mode-d) .side button[aria-current="page"]{background:var(--card);color:var(--navy);box-shadow:var(--shadow)}
:host(.mode-d) .side .badge{position:static;margin-left:auto;border:0}
:host(.mode-d) .side .b-gold{margin:10px 0 18px;font-size:16px}
:host(.mode-d) .content{padding:20px 28px 40px}
:host(.mode-d) .nav{display:none}
:host(.mode-d) .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
:host(.mode-d) .stat{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);border:2px solid transparent;text-align:left;min-height:0}
:host(.mode-d) .stat[aria-pressed="true"]{border-color:var(--gold)}
:host(.mode-d) .stat .v{font-size:30px;font-weight:900;line-height:1.1}
:host(.mode-d) .stat .l{font-size:13px;color:var(--muted);font-weight:600}
:host(.mode-d) .stat.late .v{color:var(--red)}
:host(.mode-d) .chips{display:none}
:host(.mode-d) .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
:host(.mode-d) .card .item{font-size:16px}
:host(.mode-d) .grp-h .who{font-size:16px}
:host(.mode-d) .pjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
:host(.mode-d) .pj{margin:0}
:host(.mode-d) .scrim{align-items:center}
:host(.mode-d) .sheet{border-radius:22px;max-height:86vh;padding:18px 26px 24px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
:host(.mode-d) .grab{display:none}
:host(.mode-d) .toast{bottom:32px}
.stats{display:none}
:host(.mode-m) .modeswitch{display:inline-flex}

/* phone frame when forcing mobile on a wide screen */
:host(.framed) .bd-body{background:#0A1222}
:host(.framed) .app{width:400px;height:844px;margin:28px auto;border-radius:44px;background:var(--bg);box-shadow:0 0 0 12px #1a2236,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative}
:host(.framed) .top{position:sticky;top:0}
:host(.framed) .nav,:host(.framed) .scrim,:host(.framed) .toast{position:absolute}
:host(.framed) .scrim{inset:0}
:host(.framed) .toast{bottom:96px}
:host(.framed) .content{overflow:auto;padding-bottom:110px}
:host(.framed) .modeswitch{display:none}
@media (max-width:899px){ .modeswitch{display:none!important} }
[hidden]{display:none!important}
.top .brand{white-space:nowrap}
@media (max-width:420px){ .top .brand{font-size:17px} .top .sub{font-size:11px;max-width:96px} }
:host(.framed) .frame-exit{display:inline-flex;position:fixed;top:16px;right:20px;z-index:50}
.frame-exit{display:none}
/* memo / tasks */
.sndbtn{border:1px solid var(--gold);background:transparent;color:var(--gold-soft);border-radius:10px;width:36px;height:32px;display:inline-flex;align-items:center;justify-content:center;margin-left:8px}
.sndbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.memo{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.memo h2{font-size:19px;font-weight:900;margin-bottom:4px}
.memo textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;background:var(--well);color:var(--ink);resize:vertical}
.memo textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.memo .tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.memo .tools .b{flex:1}
.mic.on{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,48,37,.5)}50%{box-shadow:0 0 0 10px rgba(217,48,37,0)}}
.task{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.task .chk{flex:0 0 28px;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--well);display:flex;align-items:center;justify-content:center;margin-top:2px}
.task.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.task .chk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.task .t{flex:1;min-width:0}
.task .title{font-weight:700;font-size:17px}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task .m{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.task .m .late{color:var(--red);font-weight:900}
.secttl{font-weight:900;font-size:16px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.secttl .n{background:var(--navy);color:var(--gold);border-radius:999px;padding:0 9px;font-size:13px}
.mtg{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.mtg .h{display:flex;gap:10px;align-items:baseline}.mtg .h b{font-size:16px}.mtg .h span{color:var(--muted);font-size:13px;margin-left:auto}
.mtg p{margin:6px 0 0;font-size:14px;color:var(--muted);white-space:pre-wrap}
.rv{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:28px 1fr;gap:6px 10px;align-items:start}
.rv.off{opacity:.45}
.rv .cb{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--well);display:flex;align-items:center;justify-content:center;margin-top:2px}
.rv.on .cb{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.rv .cb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rv input,.rv select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;font-size:15px;background:var(--well);color:var(--ink);min-height:38px}
.rv .g{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:6px}
:host(.mode-d) .memo{max-width:760px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

:host(.framed) .bd-body>.app{min-height:0}
/* ---- 10/7 夕：案件を畳む・上端の見切れ・納期の「未定」 ---- */
.top{top:0;padding-top:env(safe-area-inset-top,0px)}
.grp{scroll-margin-top:calc(76px + env(safe-area-inset-top,0px));margin:0 0 14px}
.grp.open{margin-bottom:34px}
.grp-h{cursor:pointer;margin:0;min-height:52px}
.grp-h .chev{color:var(--gold);font-size:15px;width:14px;flex:0 0 14px}
.gsum{display:flex;flex-wrap:wrap;gap:4px 12px;background:var(--card);border-radius:0 0 12px 12px;margin:-4px 0 0;padding:12px 12px 9px;font-size:13px;font-weight:700;color:var(--muted);box-shadow:var(--shadow)}
.gsum i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gsum .late{color:var(--red)}
.grp.open .gsum{margin-bottom:4px}
.grp .grp-h .tosp{color:var(--gold-soft)}
.grp .grp-h .who{flex:1 1 0;min-width:140px}
/* ---- 10/7 夜：仕入先を畳める・納品日を大きく ---- */
.grp .sup-h{cursor:pointer;min-height:40px;margin:10px 2px 6px}
.grp .sup-h .chev{font-size:13px;color:var(--muted);width:12px;flex:0 0 12px}
.grp .sup-h .mini{display:inline-flex;gap:8px;font-weight:700}
.grp .sup-h .mini i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:-1px}
.grp .sup-h.shut{background:var(--card);border-radius:10px;padding:8px 10px;margin:8px 0 0;box-shadow:var(--shadow)}
.grp .sup-h.shut::after{display:none}
.grp .grp-h .dlv,.pjgrid .pj .dlv{display:inline-flex;align-items:baseline;gap:6px;background:var(--gold);color:var(--navy);border-radius:10px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.grp .grp-h .dlv b,.pjgrid .pj .dlv b{font-size:19px;font-weight:900;letter-spacing:.01em}
.grp .grp-h .dlv small,.pjgrid .pj .dlv small{font-size:13px;font-weight:900}
.grp .grp-h .dlv.none,.pjgrid .pj .dlv.none{background:transparent;border:1.5px dashed var(--gold);color:var(--gold-soft);font-size:14px}
.pjgrid .pj .dlv.none{color:var(--muted);border-color:var(--line)}
.grp .grp-h .dlv.over,.pjgrid .pj .dlv.over{background:var(--red);color:#fff}
.pjgrid .pj .dlv{margin-bottom:2px}
.grp button.sup-h{border:0;background:transparent;width:calc(100% - 4px);text-align:left;font-family:inherit;padding:0;-webkit-tap-highlight-color:rgba(11,31,58,.12)}
.grp button.sup-h.shut{background:var(--card);width:100%;padding:8px 10px}
.grp-h{-webkit-tap-highlight-color:rgba(255,255,255,.15)}
/* ---- 10/7 夜2：検収済は小さく残す・畳んだ案件の状態を大きく ---- */
.grp .card.mini{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 16px;margin-bottom:6px;box-shadow:none;border:1px solid var(--line);background:color-mix(in srgb,var(--st4) 5%,var(--card))}
.grp .card.mini::before{width:5px;background:var(--st4)}
.grp .card.mini .item{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--muted);padding-left:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .card.mini .pill{font-size:11px;padding:3px 8px}
.grp .card.mini .act{margin:0;padding:0;gap:6px;flex:0 0 auto}
.grp .card.mini .act .b-sm{min-height:30px;padding:3px 9px;font-size:12px;flex:0 0 auto;border-width:1.5px}
.grp .gsum{gap:7px 8px;padding:15px 12px 12px}
.grp .gsum .st{display:inline-flex;align-items:baseline;gap:6px;border-radius:9px;padding:5px 12px;font-size:14px;font-weight:700;color:#fff}
.grp .gsum .st b{font-size:20px;font-weight:900;line-height:1}
.grp .gsum .st.late{background:var(--red)}
.grp .gsum .st.none{background:transparent;color:var(--muted);border:1.5px dashed var(--line)}
.grp button.sup-h{flex-wrap:wrap;row-gap:4px}
.grp .sup-h .mini{gap:5px}
.grp .sup-h .mini .st{display:inline-flex;align-items:baseline;gap:4px;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:700;color:#fff}
.grp .sup-h .mini .st b{font-size:15px;font-weight:900;color:#fff}
/* ---- 案件の画面を一覧に一本化 ---- */
.grp .gsum .bar{flex:0 0 100%;display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-bottom:5px}
.grp .gsum .bar i{display:block;height:100%}
.grp .gact{display:flex;gap:8px;margin:10px 0 2px}
.grp .gact .b{flex:1}
.grp .gact .b-ghost{flex:0 0 auto}
/* ---- 状態の札はボタン（押すとその状態だけ表示） ---- */
.grp .gsum button.st{border:0;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.1)}
.grp .gsum button.st.none{border:1.5px dashed var(--line)}
.grp .gsum .st.on{box-shadow:0 0 0 2px var(--card),0 0 0 5px var(--navy)}
.grp .gsum .st.dim{opacity:.4}
.grp .gsum .gfnote{flex:0 0 100%;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
/* ---- スケジュール：読むための表示 ---- */
.cdlist{display:flex;flex-direction:column;gap:8px;margin:0 0 6px}
.cd{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;border:0;border-radius:14px;background:var(--card);box-shadow:var(--shadow);padding:10px 12px;font-family:inherit;color:var(--ink);width:100%}
.cd .dlv{grid-row:1/3;display:inline-flex;flex-direction:column;align-items:center;gap:0;min-width:104px;background:var(--gold);color:var(--navy);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.cd .dlv b{font-size:19px;font-weight:900;line-height:1.2}
.cd .dlv small{font-size:13px;font-weight:900}
.cd .dlv.none{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-size:13px;padding:14px 8px}
.cd .dlv.over{background:var(--red);color:#fff}
.cd>b{font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd>small{font-size:13px;color:var(--muted);font-weight:700}
.cd>small em{font-style:normal;color:var(--red)}
.agw{margin:22px 2px 4px;padding-bottom:5px;border-bottom:3px solid var(--navy);font-size:17px;font-weight:900;color:var(--ink)}
.agw.red{border-color:var(--red);color:var(--red)}
.agd{display:flex;align-items:baseline;gap:10px;margin:14px 2px 6px}
.agd b{font-size:19px;font-weight:900;color:var(--ink)}
.agd span{font-size:13px;font-weight:700;color:var(--muted)}
.agd.now b,.agd.now span{color:var(--red)}
.agd.red b{color:var(--red)}
.ag{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:12px;background:var(--card);box-shadow:var(--shadow);padding:10px 12px;margin-bottom:6px;font-family:inherit;color:var(--ink)}
.ag>i{flex:0 0 8px;align-self:stretch;border-radius:4px}
.ag .tx{flex:1;min-width:0}
.ag .tx b{display:block;font-size:16px;line-height:1.3}
.ag .tx small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag.dl{background:color-mix(in srgb,var(--gold) 22%,var(--card));border:2px solid var(--gold)}
.ag.dl .tag{background:var(--gold);color:var(--navy);border-radius:8px;padding:3px 10px;font-size:14px;font-weight:900}
.ag.dl b{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.calgrid{margin-top:26px}
details.calgrid>summary{list-style:none;cursor:pointer;padding:12px 4px;font-size:15px;font-weight:700;color:var(--muted);border-top:2px solid var(--line)}
details.calgrid>summary::-webkit-details-marker{display:none}
details.calgrid>summary::before{content:"▸ "}
details.calgrid[open]>summary::before{content:"▾ "}
:host(.mode-d) .cdlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
/* ---- クラロワ風：厚みのある札・はっきりした仕切り・盛り上がるタブ／横スワイプで画面切替 ---- */
.grp .card,.ag,.cd{border:2px solid color-mix(in srgb,var(--navy) 16%,var(--line));border-bottom-width:5px;box-shadow:none}
.grp .card.mini{border-bottom-width:3px}
.ag.dl{border-color:var(--gold-dk);border-bottom-width:5px}
.grp .grp-h{border:2px solid var(--gold);border-bottom-width:5px;box-shadow:inset 0 2px 0 rgba(255,255,255,.14)}
.grp.open{background:color-mix(in srgb,var(--navy) 5%,transparent);border-radius:16px;padding-bottom:10px;outline:2px solid color-mix(in srgb,var(--navy) 18%,var(--line));outline-offset:2px}
.grp.open .gact,.grp.open>.sup-h,.grp.open>.grid{margin-left:8px;margin-right:8px}
.grp .gsum{border:2px solid color-mix(in srgb,var(--navy) 16%,var(--line));border-top:0}
.grp button.sup-h{background:var(--navy);color:#fff;border-radius:10px;padding:9px 12px;margin-top:14px;width:calc(100% - 16px);border-bottom:4px solid var(--navy-3,#16305c);box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.grp button.sup-h b{color:#fff;font-size:17px}
.grp button.sup-h .chev{color:var(--gold)}
.grp button.sup-h::after{display:none}
.grp button.sup-h.shut{background:var(--card);color:var(--muted);border:2px solid color-mix(in srgb,var(--navy) 16%,var(--line));border-bottom-width:5px;box-shadow:none;width:calc(100% - 16px);margin:8px 8px 0}
.grp button.sup-h.shut b{color:var(--ink)}
.grp button.sup-h.shut .chev{color:var(--muted)}
.grp.open>.grid{border-left:4px solid var(--navy);padding-left:8px;margin-top:8px}
.grp .gsum .st{border-bottom:3px solid rgba(0,0,0,.22)}
.grp .gsum .st.none{border-bottom:1.5px dashed var(--line)}
.chip{border-width:2px;border-bottom-width:4px;font-weight:900}

/* ---- 案件の帯：ベースの機種と台数を大きく ---- */

/* ---- スワイプ：指についてくる ---- */
.content{overflow-x:clip;position:relative}
.view{touch-action:pan-y}
@keyframes slL{from{transform:translateX(70%);opacity:.3}to{transform:none;opacity:1}}
@keyframes slR{from{transform:translateX(-70%);opacity:.3}to{transform:none;opacity:1}}
.content[data-dir="l"] .view.active{animation:slL .22s cubic-bezier(.2,.8,.2,1)}
.content[data-dir="r"] .view.active{animation:slR .22s cubic-bezier(.2,.8,.2,1)}
.dueclr{height:34px;border:2px solid var(--line);border-radius:9px;background:var(--card);color:var(--muted);padding:0 10px;font-size:13px;font-weight:700;margin-left:6px}
/* ---- 10/7 UI：カードを詰める・納期をカードで入れる・済みを畳む・スケジュール表の案件名 ---- */
.card{padding:10px 12px 10px;margin-bottom:8px;gap:2px 10px}

<script>
window.TSKBoardInit=function(host,root,bridge){
const STATUSES=["未発注","発注予定日決定","発注済","納期確認済","入荷","検収"], PLAN=1, ORD=2, ARR=4, DONE=5;
const SCOL=["#7C8798","#7A4FD0","#C97A12","#2F6FD0","#2E9E68","#1C3A6B"];
const $=s=>root.querySelector(s);
const todayStr=()=>new Date().toLocaleDateString("sv-SE");
let orders=[], allOrders=[], projects=[], tasks=[], meetings=[];
let ordersReady=false, projectsReady=false; const waiting=[]; const listeners=[];
function setOrders(list){ allOrders=list; orders=list.filter(o=>!o.hidden); }   // hidden = 仕様書から来た発注をボードで外したもの（再作成させないための印）
let sample=null, showDone=false;
let db=null, downloads=null, canWrite=true;
let filter="all";

/* ---------- sounds（合成音・外部ファイルなし） ---------- */
const snd=(()=>{
  // ---- 差し替え口：ここに音ファイル（data:URI の mp3/ogg）を入れると合成音の代わりに再生される ----
  const SAMPLES={ tap:null, ok:null, up:null, done:null, err:null, open:null, swipe:null };
  let ctx=null, on=true, bus=null, decoded={};
  try{ on = localStorage.getItem("tsk_snd")!=="off"; }catch{}
  function ac(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch{ return null; }
      // マスター：高域を少し落とし、軽くコンプで整える
      const shelf=ctx.createBiquadFilter(); shelf.type="highshelf"; shelf.frequency.value=5200; shelf.gain.value=-5;
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=3; comp.attack.value=0.004; comp.release.value=0.18;
      const master=ctx.createGain(); master.gain.value=0.95;
      bus=ctx.createGain(); bus.connect(shelf).connect(comp).connect(master).connect(ctx.destination);
      // 畳み込み残響：小さめの部屋のインパルス応答を生成（ステレオ・1.3秒・高域から先に減衰）
      const sr=ctx.sampleRate, len=Math.floor(sr*1.3), ir=ctx.createBuffer(2,len,sr);
      for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); let lp=0; for(let i=0;i<len;i++){ const t=i/len; const env=Math.pow(1-t,2.6)*Math.exp(-t*3.2); const w=Math.random()*2-1; lp+= (w-lp)*(0.35-0.3*t); d[i]=lp*env*(i<sr*0.012?0.25:1); } }
      const conv=ctx.createConvolver(); conv.buffer=ir; const wet=ctx.createGain(); wet.gain.value=0.07; const predelay=ctx.createDelay(0.1); predelay.delayTime.value=0.018;
      bus.connect(predelay).connect(conv).connect(wet).connect(shelf);
    }
    if(ctx.state==="suspended") ctx.resume(); return ctx;
  }
  function env(node,T,g,atk,hold,dec){ node.gain.setValueAtTime(0,T); node.gain.linearRampToValueAtTime(g,T+atk); node.gain.setValueAtTime(g,T+atk+hold); node.gain.exponentialRampToValueAtTime(0.0001,T+atk+hold+dec); }
  function pan(x){ const c=ctx; if(c.createStereoPanner){ const p=c.createStereoPanner(); p.pan.value=x; return p; } return c.createGain(); }
  // 本体：柔らかい立ち上がりの低音。3本の正弦波（微デチューン）＋ 1oct上を薄く
  function body(t0,f,g,dur,drop=0.8,atk=0.022,x=0){
    const c=ac(); if(!c) return; const T=c.currentTime+t0; const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.setValueAtTime(1400,T); lp.frequency.exponentialRampToValueAtTime(500,T+dur); lp.Q.value=0.9;
    const v=c.createGain(); env(v,T,g,atk,dur*0.1,dur*0.9); const pn=pan(x); lp.connect(v).connect(pn).connect(bus);
    [[1,0,1],[1,-6,0.7],[1,6,0.7],[2,0,0.22]].forEach(([m,dt,a])=>{ const o=c.createOscillator(); o.type="sine"; o.detune.value=dt; o.frequency.setValueAtTime(f*m,T); o.frequency.exponentialRampToValueAtTime(f*m*drop,T+dur); const vg=c.createGain(); vg.gain.value=a; o.connect(vg).connect(lp); o.start(T); o.stop(T+dur+0.1); });
  }
  // ガラス質：非整数倍音をごく薄く、速く減衰（高級感の「光り」）
  function glass(t0,f,g,x=0){
    const c=ac(); if(!c) return; const T=c.currentTime+t0; const pn=pan(x); const hp=c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=900; hp.connect(pn).connect(bus);
    [[2.76,1,0.09],[5.4,0.55,0.06],[8.93,0.3,0.04]].forEach(([m,a,d])=>{ const o=c.createOscillator(); o.type="sine"; o.frequency.value=f*m; const v=c.createGain(); env(v,T,g*a,0.003,0,d); o.connect(v).connect(hp); o.start(T); o.stop(T+d+0.05); });
  }
  // 息：ローパスしたノイズの短い膨らみ
  function breath(t0,g=0.012,dur=0.09,fc=1100){
    const c=ac(); if(!c) return; const T=c.currentTime+t0; const n=c.createBufferSource(); const len=Math.ceil(c.sampleRate*(dur+0.02)); const buf=c.createBuffer(1,len,c.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; n.buffer=buf;
    const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=fc; bp.Q.value=0.7; const v=c.createGain(); env(v,T,g,dur*0.3,0,dur*0.7); n.connect(bp).connect(v).connect(bus); n.start(T); n.stop(T+dur+0.05);
  }
  // スウィッシュ：掃引バンドパス
  function swish(t0,dur,f0,f1,g,q=1.4,x=0){
    const c=ac(); if(!c) return; const T=c.currentTime+t0; const n=c.createBufferSource(); const len=Math.ceil(c.sampleRate*(dur+0.05)); const buf=c.createBuffer(1,len,c.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; n.buffer=buf;
    const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=q; bp.frequency.setValueAtTime(f0,T); bp.frequency.exponentialRampToValueAtTime(f1,T+dur); const v=c.createGain(); env(v,T,g,dur*0.35,0,dur*0.65); n.connect(bp).connect(v).connect(pan(x)).connect(bus); n.start(T); n.stop(T+dur+0.05);
  }
  // パッド：鋸波をローパスで開閉（フィルターエンベロープ）、暗く広い和音
  function pad(t0,freqs,dur,g,x=0){
    const c=ac(); if(!c) return; const T=c.currentTime+t0; const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.Q.value=1.1; lp.frequency.setValueAtTime(300,T); lp.frequency.exponentialRampToValueAtTime(1500,T+dur*0.25); lp.frequency.exponentialRampToValueAtTime(350,T+dur);
    const v=c.createGain(); env(v,T,g,dur*0.18,dur*0.2,dur*0.62); lp.connect(v).connect(pan(x)).connect(bus);
    freqs.forEach((f,i)=>[-7,7].forEach(dt=>{ const o=c.createOscillator(); o.type="sawtooth"; o.frequency.value=f; o.detune.value=dt+(i%2?3:-3); const vg=c.createGain(); vg.gain.value=0.35; o.connect(vg).connect(lp); o.start(T); o.stop(T+dur+0.1); }));
  }
  async function playSample(name){ const c=ac(); if(!c) return false; const src=SAMPLES[name]; if(!src) return false; try{ if(!decoded[name]){ const r=await fetch(src); decoded[name]=await c.decodeAudioData(await r.arrayBuffer()); } const n=c.createBufferSource(); n.buffer=decoded[name]; n.connect(bus); n.start(); return true; }catch{ return false; } }
  function go(name,fn){ if(!on) return; playSample(name).then(ok=>{ if(!ok) fn(); }); }
  // 泡のような短い音：正弦波の高さをなめらかに動かす。音量はふくらんで消える。倍音は少しだけ。
  function blip(t0,fs,dur,g,x=0,atk=0.35){
    const c=ac(); if(!c) return; const T=c.currentTime+t0, a=Math.max(0.006,dur*atk); const v=c.createGain();
    v.gain.setValueAtTime(0.0001,T); v.gain.exponentialRampToValueAtTime(g,T+a); v.gain.exponentialRampToValueAtTime(0.0001,T+dur);
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3800; lp.Q.value=0.5; lp.connect(v).connect(pan(x)).connect(bus);
    [[1,1],[2,0.16],[3,0.05]].forEach(([m,amp])=>{ const o=c.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(fs[0]*m,T); const n=fs.length-1; for(let i=1;i<=n;i++) o.frequency.exponentialRampToValueAtTime(fs[i]*m,T+dur*i/n); const vg=c.createGain(); vg.gain.value=amp; o.connect(vg).connect(lp); o.start(T); o.stop(T+dur+0.05); });
  }
  const api={
    get on(){return on}, toggle(){ on=!on; try{localStorage.setItem("tsk_snd",on?"on":"off");}catch{} if(on) api.ok(); return on; },
    tap(){ go("tap",()=>{ const x=(Math.random()-0.5)*0.2; blip(0,[1040,900],0.085,0.085,x,0.5); blip(0,[330,300],0.07,0.028,x,0.4); }); },
    ok(){ go("ok",()=>{ blip(0,[880,900],0.07,0.11); blip(0.075,[1175,1185],0.14,0.12,0,0.2); }); },
    up(){ go("up",()=>{ blip(0,[520,790],0.12,0.13); blip(0.11,[1040,1560],0.07,0.05); }); },
    done(){ go("done",()=>{ [523,659,784].forEach((f,i)=>blip(i*0.075,[f,f*1.02],0.09,0.11)); blip(0.225,[1047,1060],0.3,0.13,0,0.1); }); },
    err(){ go("err",()=>{ blip(0,[300,235],0.13,0.14); blip(0.15,[280,215],0.17,0.14); }); },
    open(){ go("open",()=>{ blip(0,[330,690,450],0.13,0.12); blip(0.1,[950,1450],0.06,0.03); }); },
    swipe(){ go("swipe",()=>{ swish(0,0.11,520,300,0.05,1.2); blip(0,[300,340,300],0.1,0.05,0,0.5); }); },
  };
  return api;
})();
root.addEventListener("pointerdown",e=>{ if(e.target.closest("button,.chip,.opt,.stat")) snd.tap(); },{passive:true});
function sndIcon(){ $("#sndIco").innerHTML = snd.on ? '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/>' : '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/>'; $("#sndBtn").style.opacity= snd.on?1:.55; }
$("#sndBtn").addEventListener("click",()=>{ snd.toggle(); sndIcon(); toast(snd.on?"効果音：オン":"効果音：オフ"); }); sndIcon();

/* ---------- layout mode ---------- */
const html=host;
let forced=null;
function applyMode(){
  const wide=window.innerWidth>=900;
  const m = forced || (wide?"d":"m");

/* ---------- helpers ---------- */
function normK(s){ if(!s) return ""; s=s.normalize("NFKC").toUpperCase().replace(/[\s\-_]/g,""); if(/^\d{6}$/.test(s)) s="K"+s; return s; }

function checkK(raw){ // 入力を判定 → {ok, k, msg, level}
  const s=normK(raw); if(!s) return {ok:true,k:"",msg:"",level:""};

  if(!m) return {ok:false,k:s,msg:"形式が違います。D or K ＋ 年度2桁 ＋ 連番4桁（例 K260115）",level:"err"};
  const yy=+m[2], cur=fy();
  if(yy>cur+1||yy<cur-6) return {ok:false,k:s,msg:`年度「${m[2]}」が今年度（${String(cur).padStart(2,"0")}）から離れすぎています。打ち間違いでは？`,level:"err"};
  if(m[1]==="D") return {ok:true,k:s,msg:`見積番号です。受注済なら工事番号は K${m[2]}${m[3]} になります`,level:"warn",kk:"K"+m[2]+m[3]};

function dupK(k,exceptId){ if(!k) return null; return projects.find(p=>p.k===k&&p.id!==exceptId)||null; }

function fmtD(d){ if(!d) return "—"; const [,m,dd]=d.split("-"); return `${+m}/${+dd}`; }

  const cs=getComputedStyle(g), pl=parseFloat(cs.paddingLeft)||0, cw=g.clientWidth-pl-(parseFloat(cs.paddingRight)||0), w=Math.min(cw,520), mid=t.offsetLeft+t.offsetWidth/2, left=Math.max(pl,Math.min(mid-w/2,pl+cw-w));
  p.style.top=(t.offsetTop+t.offsetHeight+11)+"px"; p.style.left=left+"px"; p.style.width=w+"px"; p.style.setProperty("--nx",(mid-left)+"px"); }); }
function tile(o){ const si=Math.max(0,STATUSES.indexOf(o.status)), late=isLate(o);
  const when=si>=ARR?(o.stock?"在庫充当":si===DONE?"検収済み":"入荷済み"):(si<ORD&&o.planDate?`発注予定 ${fmtD(o.planDate)}`:o.due?`納期 ${fmtD(o.due)}`:"納期 未定");

function cardFull(o){

    <div class="item">${esc(o.item)}<span class="qty">×${o.qty||1}</span>${o.stock?`<span class="stk">在庫充当</span>`:""}</div><span class="pill s${si}">${esc(o.status)}</span>
    ${o.part?`<div class="from">${esc(o.part)}${o.note?"　※ "+esc(o.note):""}</div>`:""}${o.gone?`<div class="gone">仕様書から外れました</div>`:""}

    <div class="act">${next&&canWrite?`<button class="b b-sm ${si>=ARR-1?"b-green":"b-navy"}" data-act="next">${esc(next)}にする</button>`:""}${si<ORD&&canWrite?`<button class="b b-sm b-ghost stockb" data-act="stock">在庫充当</button>`:""}${si>=ORD&&canWrite?`<button class="b b-sm b-ghost back" data-act="prev">戻す</button>`:""}<button class="b b-sm b-ghost" data-act="open">詳細</button></div></article>`;

/* ---------- projects view ---------- */
function renderPj(){
  const el=$("#pjlist");
  const keys=new Map();
  projects.forEach(p=>keys.set(p.id,{p,g:[]}));
  orders.forEach(o=>{ const key=pjKey(o); if(!keys.has(key)) keys.set(key,{p:null,g:[]}); keys.get(key).g.push(o); });
  if(!keys.size){ el.innerHTML=`<div class="empty"><b>案件はまだありません</b>発注を追加すると、宛先・仕様・工事番号ごとにここへまとまります。</div>`; return; }
  el.innerHTML=[...keys.entries()].sort((a,b)=>pjCompare(a[0],a[1].g[0]||{projectId:a[0]},b[0],b[1].g[0]||{projectId:b[0]})).map(([key,{p,g}])=>{
    const L=p?{k:p.k||"",who:p.client||"（宛先未入力）",spec:p.spec||"",delivery:p.delivery||""}:(g[0]?pjLabel(g[0]):{k:"",who:"案件未設定",spec:""});
    const n=g.length; const cnt=STATUSES.map(s=>g.filter(o=>o.status===s).length); const lateN=g.filter(isLate).length;
    const nextDue=g.filter(o=>STATUSES.indexOf(o.status)<ARR&&o.due).map(o=>o.due).sort()[0];
    return `<div class="pj" data-key="${esc(key)}"><div class="row">${L.k?`<span class="k">${esc(L.k)}</span>`:""}<span class="who">${esc(L.who)}</span></div>${L.spec?`<div class="spec">${esc(L.spec)}</div>`:""}
      <div class="meta">${dlvHtml(L.delivery)}<span>${n}件</span><span>入荷済 ${cnt[ARR]+cnt[DONE]}/${n}</span>${nextDue?`<span>次の納期 ${fmtD(nextDue)}</span>`:""}${lateN?`<span class="late">遅延 ${lateN}</span>`:""}</div>
      <div class="bar">${n?cnt.map((c,i)=>c?`<i style="width:${c/n*100}%;background:${SCOL[i]}"></i>`:"").join(""):""}</div>
      <div class="act"><button class="b b-sm b-navy" data-act="orders">発注一覧</button>${p&&p.specId?`<button class="b b-sm b-ghost" data-act="spec">仕様書を開く</button>`:p&&canWrite?`<button class="b b-sm b-ghost" data-act="editpj">案件を編集</button>`:""}${canWrite?`<button class="b b-sm b-gold" data-act="addto">＋発注</button>`:""}</div></div>`;
  }).join("");
}
$("#pjlist").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b) return;

/* ---------- スケジュール表 ---------- */
// 行＝案件（納期の近い順）、列＝日付。金の「納」＝お客様への納品日、数字の印＝その日に入る予定の発注の件数。
// 印の色は、その日の発注のうちいちばん進んでいない状態の色。納期を過ぎて未入荷なら赤。今日から納品日までを薄い金で塗る。
function addDays(d,n){ const t=new Date(d+"T00:00:00"); t.setDate(t.getDate()+n); return t.toLocaleDateString("sv-SE"); }
// 予定を「読む」ための表示：①案件ごとの納品日と残り日数 ②遅れているもの ③これからの予定を日付順に
function calAgenda(rows,today){
  const ev=[], pj=[]; let nodue=0;
  rows.filter(([key])=>!dlvAt(key)).forEach(([key,{p,g}])=>{ const L=p?{k:p.k||"",who:p.client||"（宛先未入力）",delivery:p.delivery||""}:pjLabel(g[0]||{projectId:key});
    const open=g.filter(o=>STATUSES.indexOf(o.status)<ARR); nodue+=open.filter(o=>!o.due).length;
    pj.push({key,who:L.who,delivery:L.delivery||"",open:open.length,late:g.filter(isLate).length});
    if(L.delivery) ev.push({d:L.delivery,t:0,key,who:L.who});
    open.forEach(o=>{ if(o.due) ev.push({d:o.due,t:1,key,who:L.who,o}); }); });
  const day=d=>Math.round((new Date(d+"T00:00:00")-new Date(today+"T00:00:00"))/86400000);
  const rel=d=>{ const n=day(d); return n===0?"今日":n===1?"明日":n>0?`あと${n}日`:`${-n}日前`; };
  const item=e=>e.t===0?`<button type="button" class="ag dl" data-ckey="${esc(e.key)}"><span class="tag">納品</span><b>${esc(e.who)}</b></button>`
    :`<button type="button" class="ag" data-oid="${e.o.id}"><i style="background:${SCOL[Math.max(0,STATUSES.indexOf(e.o.status))]}"></i><span class="tx"><b>${esc(e.o.item)} ×${e.o.qty||1}</b><small>${esc(e.o.supplier||"仕入先 未定")}　${esc(e.who)}</small></span><span class="pill s${Math.max(0,STATUSES.indexOf(e.o.status))}">${esc(e.o.status)}</span></button>`;
  const head=`<div class="cdlist">${pj.map(x=>`<button type="button" class="cd" data-ckey="${esc(x.key)}">${dlvHtml(x.delivery)}<b>${esc(x.who)}</b><small>${x.late?`<em>遅延 ${x.late}</em>　`:""}未入荷 ${x.open}</small></button>`).join("")}</div>`;
  const late=ev.filter(e=>e.d<today).sort((a,b)=>a.d.localeCompare(b.d)), next=ev.filter(e=>e.d>=today).sort((a,b)=>a.d.localeCompare(b.d)||a.t-b.t);
  const mon=new Date(today+"T00:00:00"); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); const wk=d=>Math.floor((new Date(d+"T00:00:00")-mon)/604800000);
  let out="", lastW=-1, lastD="";
  next.forEach(e=>{ const w=wk(e.d); if(w!==lastW){ lastW=w; out+=`<div class="agw">${w===0?"今週":w===1?"来週":`${fmtD(addDays(mon.toLocaleDateString("sv-SE"),w*7))} の週`}</div>`; }
    if(e.d!==lastD){ lastD=e.d; out+=`<div class="agd ${day(e.d)===0?"now":""}"><b>${fmtDW(e.d)}</b><span>${rel(e.d)}</span></div>`; } out+=item(e); });
  return head+(late.length?`<div class="agw red">過ぎているもの ${late.length}件</div>${late.map(e=>`<div class="agd red"><b>${fmtDW(e.d)}</b><span>${rel(e.d)}</span></div>${item(e)}`).join("")}`:"")
    +(next.length?out:`<div class="empty" style="margin-top:12px"><b>これからの予定はまだありません</b>発注に納期を入れると、ここに日付順で並びます。</div>`)
    +(nodue?`<p class="hint" style="margin:12px 2px">納期が未定の発注が ${nodue}件あります。一覧で納期を入れると、ここに並びます。</p>`:"");
}
// 月のカレンダー：1日＝1マス。金の札＝お客様への納品、色の札＝その日に入る予定の発注（色はいちばん進んでいない状態、過ぎていれば赤）。
let calDays=new Map();
function calMonths(rows,today){
  calDays=new Map(); const at=d=>{ if(!calDays.has(d)) calDays.set(d,{dl:[],due:[],plan:[]}); return calDays.get(d); }; let lastDate=today, nodue=0;
  rows.forEach(([key,{p,g}])=>{ const L=p?{k:p.k||"",who:p.client||"（宛先未入力）",delivery:p.delivery||""}:pjLabel(g[0]||{projectId:key});
    const dv=dlvAt(key); if(dv){ at(dv).dl.push({key,who:L.who,k:L.k||"",done:true}); return; }
    if(L.delivery){ at(L.delivery).dl.push({key,who:L.who,k:L.k||""}); if(L.delivery>lastDate) lastDate=L.delivery; }
    g.forEach(o=>{ if(STATUSES.indexOf(o.status)>=ARR) return; if(o.status===STATUSES[PLAN]&&o.planDate){ at(o.planDate).plan.push({o,key,who:L.who,k:L.k||""}); if(o.planDate>lastDate) lastDate=o.planDate; } if(!o.due){ nodue++; return; } at(o.due).due.push({o,key,who:L.who,k:L.k||""}); if(o.due>lastDate) lastDate=o.due; }); });
  const first=new Date(today.slice(0,7)+"-01T00:00:00"), months=[]; let m=new Date(first), capM=new Date(first); capM.setMonth(capM.getMonth()+3);
  const endM=new Date(lastDate.slice(0,7)+"-01T00:00:00"), minEnd=new Date(first); minEnd.setMonth(minEnd.getMonth()+1);
  const stop=endM>capM?capM:(endM<minEnd?minEnd:endM);
  while(m<=stop){ months.push(new Date(m)); m.setMonth(m.getMonth()+1); }
  const iso=d=>d.toLocaleDateString("sv-SE");
  const cell=d=>{ const s=iso(d), e=calDays.get(s), w=d.getDay(); let chips="";
    if(e){ const byK=list=>{ const m=new Map(); list.forEach(x=>{ if(!m.has(x.key)) m.set(x.key,[]); m.get(x.key).push(x); }); return [...m.values()]; };
      chips+=e.dl.slice(0,3).map(x=>`<span class="dch dl ${x.done?"done":""}">${x.done?"済":"納"}${k3(x.k)?`<b>${k3(x.k)}</b>`:`<i class="sp">品</i>`}<i class="pc"> ${esc(x.who.replace(/^[（(][^）)]*[）)]/,"").slice(0,5))}</i></span>`).join("");
      byK(e.plan).forEach(l=>{ chips+=`<span class="dch" style="background:${SCOL[PLAN]}">${k3(l[0].k)?`<b>${k3(l[0].k)}</b> `:""}<i class="pc">発注予定 </i><i class="sp">発</i>${l.length}件</span>`; });
      byK(e.due).forEach(l=>{ const late=s<today, si=Math.min(...l.map(x=>Math.max(0,STATUSES.indexOf(x.o.status)))); chips+=`<span class="dch ${late?"late":""}" style="${late?"":`background:${SCOL[si]}`}">${k3(l[0].k)?`<b>${k3(l[0].k)}</b> `:""}<i class="pc">${late?"遅延":"入荷"} </i>${l.length}件</span>`; }); }
    return `<button type="button" class="dcell ${w===0||w===6?"we":""} ${s===today?"today":""} ${s<today?"past":""} ${e?"has":""}" data-day="${s}" ${e?"":"tabindex=-1"} aria-label="${fmtDW(s)}${e?` 予定あり`:""}"><span class="dn">${d.getDate()}</span>${chips}</button>`; };
  const html=months.map(m0=>{ const y=m0.getFullYear(), mo=m0.getMonth(); const start=new Date(m0); start.setDate(1-((start.getDay()+6)%7)); let weeks="";
    for(let w=0;w<6;w++){ let row="", any=false; for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+w*7+i); if(d.getMonth()===mo){ any=true; row+=cell(d); } else row+=`<span class="dcell out"></span>`; } if(any) weeks+=`<div class="wk">${row}</div>`; }
    return `<section class="mcal"><h3>${y}年${mo+1}月</h3><div class="wk hd">${"月火水木金土日".split("").map(c=>`<span>${c}</span>`).join("")}</div>${weeks}</section>`; }).join("");
  return `<div class="legend"><span><i style="background:var(--gold)"></i>納＝納品日</span><span><i class="dlvdot"></i>済＝納品済み</span>${STATUSES.slice(0,ARR).map((s,i)=>`<span><i style="background:${SCOL[i]}"></i>${s}</span>`).join("")}<span><i style="background:var(--red)"></i>遅延</span><span>日付を押すと中身が出ます</span></div>${html}${nodue?`<p class="hint" style="margin:0 2px 8px">納期が未定の発注が ${nodue}件あります。一覧で納期を入れると、カレンダーに出ます。</p>`:""}`;
}
function renderCal(){
  const el=$("#cal"), today=todayStr();
  const keys=new Map(); projects.forEach(p=>keys.set(p.id,{p,g:[]}));
  orders.forEach(o=>{ const k=pjKey(o); if(!keys.has(k)) keys.set(k,{p:null,g:[]}); keys.get(k).g.push(o); });
  const rows=[...keys.entries()].sort((a,b)=>pjCompare(a[0],a[1].g[0]||{projectId:a[0]},b[0],b[1].g[0]||{projectId:b[0]}));
  if(!rows.length){ el.innerHTML=`<div class="empty"><b>まだ予定がありません</b>仕様書に納品日を入れるか、発注に納期予定を入れると、ここに並びます。</div>`; return; }
  let last=addDays(today,35);
  rows.forEach(([k,v])=>{ if(v.p&&v.p.delivery&&v.p.delivery>last) last=v.p.delivery; v.g.forEach(o=>{ if(o.due&&o.due>last&&STATUSES.indexOf(o.status)<ARR) last=o.due; }); });
  const start=addDays(today,-3), cap=addDays(today,90); if(last>cap) last=cap; last=addDays(last,2);
  const days=[]; for(let d=start; d<=last; d=addDays(d,1)) days.push(d);
  const wd="日月火水木金土", dow=d=>new Date(d+"T00:00:00").getDay();
  const months=[]; days.forEach(d=>{ const m=d.slice(0,7); if(months.length&&months[months.length-1].m===m) months[months.length-1].n++; else months.push({m,n:1}); });
  const head=`<thead><tr><th class="lab" rowspan="2">案件</th>${months.map(x=>`<th class="mo" colspan="${x.n}">${+x.m.slice(0,4)}年${+x.m.slice(5)}月</th>`).join("")}</tr><tr>${days.map(d=>`<th class="${dow(d)%6===0?"we":""} ${d===today?"today":""}"><b>${+d.slice(8)}</b>${d===today?"今日":wd[dow(d)]}</th>`).join("")}</tr></thead>`;
  const body=rows.filter(([key])=>!dlvAt(key)).map(([key,{p,g}])=>{
    const L=p?{k:p.k||"",who:p.client||"（宛先未入力）",delivery:p.delivery||""}:pjLabel(g[0]);
    const lateBefore=g.filter(o=>isLate(o)&&o.due<start).length, noDue=g.filter(o=>!o.due&&STATUSES.indexOf(o.status)<ARR).length;
    const cells=days.map(d=>{
      const due=g.filter(o=>o.due===d); let inner="";
      if(L.delivery===d) inner+=`<span class="dl" title="納品日">納</span>`;
      if(due.length){ const late=due.some(isLate); const si=Math.min(...due.map(o=>Math.max(0,STATUSES.indexOf(o.status)))); inner+=`<button type="button" class="mk s${si} ${late?"late":""}" data-key="${esc(key)}" data-d="${d}" aria-label="${fmtD(d)} 納期 ${due.length}件">${due.length}</button>`; }
      const span=L.delivery&&d>=today&&d<=L.delivery;
      return `<td class="d ${dow(d)%6===0?"we":""} ${span?"span":""} ${d===today?"today":""}">${inner}</td>`;
    }).join("");
    return `<tr><td class="lab" data-key="${esc(key)}">${L.k?`<span class="k">${esc(L.k)}</span>`:""}<b>${esc(L.who)}</b><small>${L.delivery?`納品 ${fmtDW(L.delivery)}`:"納品日 未定"}${noDue?`　納期未定 ${noDue}`:""}</small>${lateBefore?`<small class="late">これより前に遅延 ${lateBefore}件</small>`:""}</td>${cells}</tr>`;
  }).join("");
  el.innerHTML=calMonths(rows,today)+`<details class="calmore"><summary>日付順のリストで見る</summary>${calAgenda(rows,today)}</details><details class="calgrid"><summary>案件ごとの表で見る</summary><div class="legend"><span><i style="background:var(--gold)"></i>納＝納品日</span>${STATUSES.map((s,i)=>`<span><i style="background:${SCOL[i]}"></i>${s}</span>`).join("")}<span><i style="background:var(--red)"></i>遅延</span><span>数字＝その日に入る発注の件数</span></div><div class="calwrap"><table class="cal">${head}<tbody>${body}</tbody></table></div><p class="hint" style="margin-top:10px">横にスクロールできます。数字を押すと、その日の発注が開きます。案件名を押すと一覧へ移ります。</p></details>`;
}

/* ---------- add flow (3 steps) ---------- */
let draft=null;

function stepsHtml(s){ return `<div class="steps">${[1,2,3].map(i=>`<i class="${i<s?"done":i===s?"on":""}"></i>`).join("")}</div>`; }
function renderStep(){
  const d=draft;
  if(d.step===1){

        <div class="f"><label for="n-spec">何の仕様（機種・台数・用途）</label><input id="n-spec" placeholder="例：GTrig Jr. ジュニア仕様 ×4" value="${esc(d.newPj.spec)}"></div>
        <div class="f"><label for="n-k">工事番号（K番号）　※未定なら空欄</label><input id="n-k" placeholder="K260115" value="${esc(d.newPj.k)}" inputmode="latin" autocapitalize="characters"></div>
      </div>
      <div class="btns"><button class="b b-ghost" data-x="cancel">やめる</button><button class="b b-gold" data-x="next">次へ　品名・仕入先</button></div>`);

      <div class="f"><label for="a-sup">仕入先</label><input id="a-sup" placeholder="例：Fanatec / SPK / コジマ" value="${esc(d.supplier)}" list="dl-sup"></div><datalist id="dl-sup">${sup.map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
      <div class="btns"><button class="b b-ghost" data-x="back">戻る</button><button class="b b-gold" data-x="next">次へ　納期</button></div>`);
  } else {
    openSheet(`<h2>いつ届く？</h2><div class="lead">${esc(pjTitle())}　／　${esc(d.item)}</div>${stepsHtml(3)}
      <div class="row2"><div class="f"><label for="a-od">発注日</label><input id="a-od" type="date" value="${esc(d.orderDate)}"></div><div class="f"><label for="a-due">納期予定</label><input id="a-due" type="date" value="${esc(d.due)}"></div></div>
      <div class="f"><label>いまの状態</label><div class="seg" id="seg">${STATUSES.map((s,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===d.status}">${s}</button>`).join("")}</div></div>
      <div class="btns"><button class="b b-ghost" data-x="back">戻る</button><button class="b b-gold" data-x="save">${d.editId?"変更を保存":"登録する"}</button></div>`);

function pjTitle(){ const d=draft; if(d.projectId==="__new") return [d.newPj.k,d.newPj.client,d.newPj.spec].filter(Boolean).join("　"); const p=projects.find(x=>x.id===d.projectId); return p?[p.k,p.client,p.spec].filter(Boolean).join("　"):"案件未設定"; }
function readStep(){
  const d=draft;
  if(d.step===1 && d.projectId==="__new"){ d.newPj={client:$("#n-client").value.trim(),spec:$("#n-spec").value.trim(),k:normK($("#n-k").value)}; }

sheet.addEventListener("input",e=>{ const t=e.target; if(t.id==="n-k") kFeedback(t,null); if(t.id==="e-k") kFeedback(t,sheet.dataset.pid||null); });
sheet.addEventListener("click",e=>{ const l=e.target.closest(".lnk[data-kk]"); if(!l) return; const inp=l.closest(".f").querySelector("input"); inp.value=l.dataset.kk; inp.dispatchEvent(new Event("input",{bubbles:true})); snd.tap(); });
sheet.addEventListener("click",async e=>{
  const sb=e.target.closest("#seg button"); if(sb){ draft.status=+sb.dataset.i; sheet.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed",x===sb)); return; }
  const po=e.target.closest("#pjopts .opt"); if(po){ draft.projectId=po.dataset.id; sheet.querySelectorAll("#pjopts .opt").forEach(x=>x.setAttribute("aria-pressed",x===po)); $("#newpj").style.display= po.dataset.id==="__new"?"block":"none"; if(po.dataset.id==="__new") $("#n-client").focus(); return; }
  const b=e.target.closest("button[data-x]"); if(!b||!draft) return;
  const x=b.dataset.x;
  if(x==="cancel"){ closeSheet(); return; }
  if(x==="back"){ readStep(); draft.step--; renderStep(); return; }
  if(x==="next"){
    readStep();
    if(draft.step===1){ if(!draft.projectId){ toast("案件を選ぶか、新しく作ってください"); return; } if(draft.projectId==="__new"&&!draft.newPj.client&&!draft.newPj.k){ toast("宛先か工事番号を入れてください"); return; }
      if(draft.projectId==="__new"&&draft.newPj.k){ const r=kFeedback($("#n-k"),null); if(!r.ok){ toast("工事番号の形式を直してください"); return; } if(r.dup){ toast("この工事番号は既にあります。上の一覧から選んでください"); return; } } }
    if(draft.step===2&&(!draft.item||!draft.supplier)){ toast("品名と仕入先は必須です"); return; }
    draft.step++; renderStep(); return;
  }
  if(x==="save"){
    readStep(); b.disabled=true;
    try{
      let pid=draft.projectId;
      if(pid==="__new"){ pid=gid("p"); await saveProject(pid,{...draft.newPj,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}); }
      else if(pid){ const p=projects.find(q=>q.id===pid); if(p) await saveProject(pid,{...strip(p),updatedAt:new Date().toISOString()}); }
      const p=projects.find(q=>q.id===pid)||(pid&&draft.projectId==="__new"?draft.newPj:null);
      const now=new Date().toISOString();
      const prev=draft.editId?orders.find(o=>o.id===draft.editId):null;
      await saveOrder(draft.editId||gid("o"),{...(prev?strip(prev):{}),projectId:pid||"",k:p?p.k:(prev?.k||""),item:draft.item,supplier:draft.supplier,orderDate:draft.orderDate||"",due:draft.due||"",status:STATUSES[draft.status],createdAt:prev?.createdAt||now,updatedAt:now});
      snd.ok(); toast(draft.editId?"保存しました":"登録しました"); closeSheet(); draft=null; showView("list");
    }catch(err){ console.error(err); toast("保存できませんでした"); b.disabled=false; }
  }
});

function openDetail(o){
  const L=pjLabel(o); const si=STATUSES.indexOf(o.status); const next=si<DONE?STATUSES[si<ORD?ORD:si+1]:null;
  openSheet(`<div class="detail"><h2>${esc(o.item)}</h2><div class="lead">${esc([L.k,L.who,L.spec].filter(Boolean).join("　"))}</div>
    ${o.gone?`<div class="gone">仕様書から外れました（発注は残しています）</div>`:""}<dl>${o.part?`<dt>項目</dt><dd>${esc(o.part)}</dd>`:""}<dt>数量</dt><dd>${o.qty||1}${o.stock?"　（在庫充当）":""}</dd><dt>仕入先</dt><dd>${esc(o.supplier)||"—"}</dd>${o.note?`<dt>備考</dt><dd>${esc(o.note)}</dd>`:""}<dt>発注日</dt><dd>${o.orderDate||"—"}</dd><dt>納期予定</dt><dd class="${isLate(o)?"late":""}" style="${isLate(o)?"color:var(--red)":""}">${o.due||"—"}${isLate(o)?"　遅延":""}</dd><dt>状態</dt><dd>${esc(o.status)}</dd></dl>
    ${canWrite?`<div class="btns">${next?`<button class="b ${si>=ARR-1?"b-green":"b-navy"}" data-d="next">${esc(next)}にする</button>`:""}${si>0?`<button class="b b-ghost" data-d="prev">${esc(STATUSES[si-1])}に戻す</button>`:""}<button class="b b-ghost" data-d="edit">編集</button></div><div class="btns"><button class="b b-red" data-d="del">削除</button><button class="b b-ghost" data-d="close" style="flex:1">閉じる</button></div>`:`<div class="btns"><button class="b b-ghost" data-d="close" style="flex:1">閉じる</button></div>`}</div>`);
  sheet.onclick=async e=>{
    const b=e.target.closest("button[data-d]"); if(!b) return;
    const a=b.dataset.d;
    if(a==="close"){ closeSheet(); }
    if(a==="next"){ b.disabled=true; try{ await saveOrder(o.id,{...strip(o),status:next,updatedAt:new Date().toISOString()}); toast(`${next}にしました`); closeSheet(); }catch{ toast("更新できませんでした"); } }
    if(a==="prev"&&si>0){ b.disabled=true; try{ await saveOrder(o.id,{...strip(o),status:STATUSES[si-1],updatedAt:new Date().toISOString()}); toast(`${STATUSES[si-1]}に戻しました`); closeSheet(); }catch{ toast("更新できませんでした"); } }
    if(a==="edit"){ sheet.onclick=null; draft={step:2,projectId:o.projectId||null,newPj:{client:"",spec:"",k:""},item:o.item,supplier:o.supplier,orderDate:o.orderDate,due:o.due,status:Math.max(0,si),editId:o.id}; renderStep(); }
    if(a==="del"){ if(!confirm(o.specKey?"この発注をボードから外します。仕様書の品はそのまま残ります。よろしいですか？":"この発注を削除します。よろしいですか？")) return; try{ if(o.specKey) await saveOrder(o.id,{...strip(o),hidden:true,updatedAt:new Date().toISOString()}); else await deleteOrder(o.id); toast("削除しました"); closeSheet(); }catch{ toast("削除できませんでした"); } }
    if(a!=="edit") sheet.onclick=null;
  };
}
function openEditPj(p){

function ledgerRows(){ const m=$("#month").value, mode=$("#lmode").value; return orders.filter(o=>{ if(mode==="all"||!m) return true; const d=mode==="order"?o.orderDate:o.due; return d&&d.startsWith(m); }).sort((a,b)=>{ const la=pjLabel(a), lb=pjLabel(b); return la.who.localeCompare(lb.who)||(la.k||"～").localeCompare(lb.k||"～")||(a.due||"9999").localeCompare(b.due||"9999"); }); }
function renderLedger(){
  const rows=ledgerRows(), t=$("#ltable");
  const head=`<thead><tr><th>宛先</th><th>仕様</th><th>工事番号</th><th>品名</th><th>仕入先</th><th>発注日</th><th>納期予定</th><th>状態</th><th>遅延</th></tr></thead>`;

$("#csv").addEventListener("click",async()=>{

(()=>{

  let rec=null, base="";

    rec.onend=()=>{ rec=null; mic.classList.remove("on"); mic.textContent="🎤 音声で入力"; };

function strip(o){ const {id,...r}=o; return r; }
async function saveOrder(id,data){ if(db) await db.collection("orders").doc(id).set(data); else { const l=allOrders.slice(); const i=l.findIndex(o=>o.id===id); if(i>=0) l[i]={id,...data}; else l.push({id,...data}); setOrders(l); onData(); } }
async function deleteOrder(id){ if(db) await db.collection("orders").doc(id).delete(); else { setOrders(allOrders.filter(o=>o.id!==id)); onData(); } }
async function deleteProject(id){ if(db) await db.collection("projects").doc(id).delete(); else { projects=projects.filter(p=>p.id!==id); onData(); } }
async function saveTask(id,data){ if(db) await db.collection("tasks").doc(id).set(data); else { const i=tasks.findIndex(t=>t.id===id); if(i>=0) tasks[i]={id,...data}; else tasks.push({id,...data}); onData(); } }
async function deleteTask(id){ if(db) await db.collection("tasks").doc(id).delete(); else { tasks=tasks.filter(t=>t.id!==id); onData(); } }
async function saveMeeting(id,data){ if(db) await db.collection("meetings").doc(id).set(data); else { meetings.push({id,...data}); onData(); } }
async function saveProject(id,data){ if(db) await db.collection("projects").doc(id).set(data); else { const i=projects.findIndex(p=>p.id===id); if(i>=0) projects[i]={id,...data}; else projects.push({id,...data}); onData(); } }

$("#toSpec").addEventListener("click",()=>bridge.home());
function mirrorTheme(){ const t=document.documentElement.getAttribute("data-theme"); if(t) host.setAttribute("data-theme",t); else host.removeAttribute("data-theme"); }
mirrorTheme(); try{ new MutationObserver(mirrorTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]}); }catch{}
function hashKey(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return h.toString(36); }
function whenReady(){ return new Promise(res=>{ if(ordersReady&&projectsReady) res(); else waiting.push(res); }); }
let chain=Promise.resolve();
// x = {id, client, spec, k, delivery, units, lines:[{key, part, name, note, vendor}]} … one saved specification.
// Brings the project and its orders in line with it. Orders already under way are never reset or removed.
function syncSpec(x){ chain=chain.then(()=>doSync(x)).catch(err=>console.error(err)); return chain; }
async function doSync(x){
  await whenReady(); if(!canWrite) return;
  const pid="sp_"+x.id, now=new Date().toISOString();
  const cur=projects.find(p=>p.id===pid);
  const pj={client:x.client,spec:x.spec,k:x.k,delivery:x.delivery,specId:x.id};
  if(!cur) await saveProject(pid,{...pj,createdAt:now,updatedAt:now});
  else if(Object.keys(pj).some(f=>(cur[f]||"")!==pj[f])) await saveProject(pid,{...strip(cur),...pj,updatedAt:now});
  const mine=allOrders.filter(o=>o.projectId===pid&&o.specKey); const want=new Map(x.lines.map(l=>[l.key,l]));
  for(const [key,l] of want){
    const oid="so_"+x.id+"_"+hashKey(key);
    const o=mine.find(v=>v.specKey===key)||allOrders.find(v=>v.id===oid);   // by id too: an order kept after an earlier un-link is picked up again, never overwritten
    if(!o){ await saveOrder(oid,{projectId:pid,k:x.k,item:l.name,part:l.part,note:l.note,qty:x.units,supplier:l.vendor,srcSupplier:l.vendor,orderDate:"",due:"",status:STATUSES[0],specKey:key,createdAt:now,updatedAt:now}); continue; }
    const n={...strip(o)}; let ch=false;
    const set=(f,v)=>{ if((n[f]??"")!==v){ n[f]=v; ch=true; } };
    set("projectId",pid); set("specKey",key); set("k",x.k); set("part",l.part); set("note",l.note); set("qty",x.units);
    if((o.srcSupplier||"")!==l.vendor){ if((o.supplier||"")===(o.srcSupplier||"")) n.supplier=l.vendor; n.srcSupplier=l.vendor; ch=true; }   // a supplier typed on the board stays
    if(o.gone){ delete n.gone; ch=true; }
    if(ch){ n.updatedAt=now; await saveOrder(o.id,n); }
  }
  for(const o of mine){ if(want.has(o.specKey)) continue;
    if(o.status===STATUSES[0]||o.hidden) await deleteOrder(o.id);            // not ordered yet: simply follows the specification
    else if(!o.gone) await saveOrder(o.id,{...strip(o),gone:true,updatedAt:now}); }   // already ordered: kept, and flagged
}
// The specification leaves the board: orders not placed yet go, the rest stay as an ordinary project.
function unlinkSpec(id){ chain=chain.then(async()=>{ await whenReady(); if(!canWrite) return; const pid="sp_"+id;
  for(const o of allOrders.filter(v=>v.projectId===pid&&v.specKey)){ if(o.status===STATUSES[0]||o.hidden) await deleteOrder(o.id); else { const n={...strip(o)}; delete n.specKey; delete n.gone; delete n.srcSupplier; await saveOrder(o.id,n); } }
  const p=projects.find(v=>v.id===pid); if(!p) return;
  if(allOrders.some(o=>o.projectId===pid&&!(o.specKey&&(o.status===STATUSES[0]||o.hidden)))){ const n={...strip(p)}; delete n.specId; await saveProject(pid,n); } else await deleteProject(pid);
}).catch(err=>console.error(err)); return chain; }
function statsOf(specId){ const g=specId?orders.filter(o=>o.projectId==="sp_"+specId):orders.filter(o=>!oDlv(o)); return {n:g.length,open:g.filter(o=>STATUSES.indexOf(o.status)<ARR).length,todo:g.filter(o=>o.status===STATUSES[0]).length,in:g.filter(o=>STATUSES.indexOf(o.status)>=ARR).length,late:g.filter(isLate).length,soon:g.filter(dueSoon).length}; }
const api={ sync:syncSpec, unlink:unlinkSpec, stats:statsOf, showProject:id=>showGroup("sp_"+id), showHome:()=>showView("list"), onChange:f=>listeners.push(f), close:closeSheet, checkK,
  deliveredAt:id=>dlvAt("sp_"+id), canWrite:()=>canWrite,
  setDelivered:(id,v)=>{ chain=chain.then(async()=>{ await whenReady(); if(!canWrite) return; await setDelivered("sp_"+id,v); }).catch(err=>console.error(err)); return chain; } };

/* ---------- 横スワイプで画面を切り替える（一覧 ⇄ 予定 ⇄ 台帳 ⇄ 議事録）。画面が指についてくる ---------- */

const contentEl=$(".content");
function scrollsSideways(el){ for(let n=el;n&&n!==contentEl;n=n.parentElement){ if(n.matches&&n.matches("input,textarea,select")) return true; if(n.scrollWidth>n.clientWidth+6){ const ox=getComputedStyle(n).overflowX; if(ox==="auto"||ox==="scroll") return true; } } return false; }
function curView(){ return root.querySelector(".view.active"); }
function neighbor(dir){ const v=curView(); if(!v) return null; const i=VIEW_ORDER.indexOf(v.id.replace("view-","")), n=i+dir; return i<0||n<0||n>=VIEW_ORDER.length?null:VIEW_ORDER[n]; }
// 隣の画面を、いま見えている位置の横に並べる（指を動かすと一緒についてくる）。使い終わったら元に戻す。
function peekShow(to){ const nv=$("#view-"+to); if(!nv) return null; if(to==="cal") renderCal(); if(to==="ledger") renderLedger();
  const cr=contentEl.getBoundingClientRect(), cs=getComputedStyle(contentEl), framed=html.classList.contains("framed");
  const top=parseFloat(cs.paddingTop)+scrollPos()-(viewY["view-"+to]||0);
  nv.style.cssText=`display:block;position:absolute;top:${top}px;left:${cs.paddingLeft};right:${cs.paddingRight};will-change:transform;pointer-events:none`; return nv; }
function peekHide(nv){ if(nv) nv.style.cssText=""; }
contentEl.addEventListener("touchstart",e=>{ if(sw&&sw.nv) peekHide(sw.nv); sw=null; if(e.touches.length!==1||html.classList.contains("mode-d")||scrollsSideways(e.target)) return; const v=curView(); if(!v) return;
  sw={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now(),v,lock:0,dx:0,nv:null,to:null}; },{passive:true});
contentEl.addEventListener("touchmove",e=>{ if(!sw) return; const t=e.touches[0], dx=t.clientX-sw.x, dy=t.clientY-sw.y;
  if(!sw.lock){ if(Math.abs(dx)<10&&Math.abs(dy)<10) return; if(Math.abs(dx)>Math.abs(dy)*1.3){ sw.lock=1; endHold&&endHold(); sw.v.style.transition="none"; sw.v.style.willChange="transform"; } else { sw=null; return; } }
  if(e.cancelable) e.preventDefault();
  const dir=dx<0?1:-1, to=neighbor(dir), w=contentEl.clientWidth||360; sw.dx=to?dx:dx*0.22;                      // 端では引っぱっても少ししか動かない
  if(to!==sw.to){ peekHide(sw.nv); sw.to=to; sw.nv=to?peekShow(to):null; }
  sw.v.style.transform=`translateX(${sw.dx}px)`;
  if(sw.nv) sw.nv.style.transform=`translateX(${sw.dx+dir*w}px)`; },{passive:false});
function swEnd(){ if(!sw) return; const s=sw; sw=null; if(!s.lock){ peekHide(s.nv); return; } const v=s.v, nv=s.nv, w=contentEl.clientWidth||360, dir=s.dx<0?1:-1, to=neighbor(dir);
  const far=Math.abs(s.dx)>Math.min(120,w*0.24), flick=Math.abs(s.dx)>36&&Date.now()-s.t<260;
  const reset=()=>{ v.style.transform=""; v.style.opacity=""; v.style.transition=""; v.style.willChange=""; };
  const ease="cubic-bezier(.2,.8,.2,1)";
  if(to&&(far||flick)&&v.animate){ heldAt=0; relAt=Date.now(); snd.swipe();          // 直後のタップは無視（めくった指が離れた瞬間の誤タップ防止）
    if(nv&&nv.animate) nv.animate([{transform:`translateX(${s.dx+dir*w}px)`},{transform:"translateX(0px)"}],{duration:180,easing:ease,fill:"forwards"});
    v.animate([{transform:`translateX(${s.dx}px)`},{transform:`translateX(${-dir*w}px)`}],{duration:180,easing:ease,fill:"forwards"}).finished.catch(()=>{}).then(()=>{ v.getAnimations().forEach(x=>x.cancel()); if(nv){ nv.getAnimations().forEach(x=>x.cancel()); peekHide(nv); } reset(); showView(to); }); }
  else if(v.animate){ if(nv&&nv.animate) nv.animate([{transform:`translateX(${s.dx+dir*w}px)`},{transform:`translateX(${dir*w}px)`}],{duration:190,easing:ease}).finished.catch(()=>{}).then(()=>peekHide(nv)); else peekHide(nv);
    v.animate([{transform:`translateX(${s.dx}px)`},{transform:"none"}],{duration:190,easing:ease}).finished.catch(()=>{}).then(reset); reset(); }
  else { peekHide(nv); reset(); } }
contentEl.addEventListener("touchend",swEnd,{passive:true}); contentEl.addEventListener("touchcancel",swEnd,{passive:true});
root.querySelectorAll(".view").forEach(v=>{ if(VIEW_ORDER.indexOf(v.id.replace("view-",""))>=0) v.insertAdjacentHTML("afterbegin",'<div class="swhint">◀ 左右にスワイプで画面を切り替え ▶</div>'); });
return api;
};

  window.addEventListener('resize', function () { growAll(); if (ui.screen === 'print') fitSheet(); });

  try {
    if (window.TSKBoardInit && boardHost.attachShadow) {
      var boardRoot = boardHost.attachShadow({ mode: 'open' });
      boardRoot.appendChild(document.getElementById('boardTpl').content.cloneNode(true));
      board = window.TSKBoardInit(boardHost, boardRoot, { home: function () { setMode('spec'); }, openSpec: openSpecFromBoard, renameSpec: renameSpecFromBoard, editSpec: editSpecFromBoard });
      board.onChange(function () { if (mode === 'spec' && (ui.screen === 'models' || (ui.screen === 'spec' && record() && record().board)) && (!document.activeElement || document.activeElement === document.body)) render(); });
    }
  } catch (e) { board = null; }

  render();
  connect();
  try { if (board && localStorage.getItem('tsk-mode') === 'board') setMode('board'); } catch (e) {}
})();
</script>
</body>
